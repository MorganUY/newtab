<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#fcee0a; --cyan:#00f0ff; --red:#ff003c;
  --bg:#07070a; --panel:#101014; --dim:#8a8670; --text:#f3efc4;
  --mono:'Share Tech Mono','Consolas','Courier New',monospace;
  --head:'Rajdhani','Bahnschrift','Arial Narrow',sans-serif;
}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(13px,min(.62vw + 7px,1.7vh),26px)}
body{background:var(--bg);color:var(--text);font-family:var(--mono);height:100vh;overflow:hidden;padding:1.1rem}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}

.desk{height:100%}
.split{display:flex;min-width:0;min-height:0}
.split.h{flex-direction:row}.split.v{flex-direction:column}
.split>*:not(.gutter){flex:1 1 0px;min-width:0;min-height:0}
.gutter{flex:0 0 1.1rem;position:relative;touch-action:none}
.split.h>.gutter{cursor:col-resize}.split.v>.gutter{cursor:row-resize}
.gutter::after{content:"";position:absolute;background:var(--yellow);opacity:0;transition:opacity .15s}
.split.h>.gutter::after{left:calc(50% - 1px);width:2px;top:15%;bottom:15%}
.split.v>.gutter::after{top:calc(50% - 1px);height:2px;left:15%;right:15%}
.gutter:hover::after,.gutter.on::after{opacity:.85}
.win{
  position:relative;background:var(--panel);border:1px solid var(--yellow);min-width:0;min-height:0;
  clip-path:polygon(0 0,calc(100% - 1.2rem) 0,100% 1.2rem,100% 100%,1.2rem 100%,0 calc(100% - 1.2rem));
  display:flex;flex-direction:column;
}
.bar{user-select:none;display:flex;justify-content:space-between;background:var(--yellow);color:#000;
  font:700 .85rem var(--head);letter-spacing:.14em;padding:.3rem 1.8rem .3rem .9rem}
.in{padding:1.1rem 1.3rem 1.3rem;flex:1;min-height:0;position:relative}

.w-main .in{display:flex;flex-direction:column;justify-content:space-between;gap:1.4rem}
#clock{font:700 clamp(2.6rem,min(6vw,9vh),8rem)/1 var(--head);color:var(--yellow);letter-spacing:.04em;
  text-shadow:2px 0 var(--red),-2px 0 var(--cyan);animation:glitch 7s infinite steps(1)}
@keyframes glitch{
  0%,92%,100%{transform:none;text-shadow:2px 0 var(--red),-2px 0 var(--cyan)}
  93%{transform:translate(-4px,1px);text-shadow:-6px 0 var(--red),6px 0 var(--cyan)}
  95%{transform:translate(3px,-1px);text-shadow:5px 0 var(--red),-5px 0 var(--cyan)}
  97%{transform:none}
}
#date{color:var(--cyan);font-size:1.15rem;margin:.6rem 0 .25rem}
#greet{color:var(--dim);font-size:.95rem}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--yellow);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.term{display:flex;align-items:center;gap:.75rem;border:1px solid var(--dim);border-left:4px solid var(--yellow);background:#0a0a0d;padding:.85rem 1rem;font-size:1.15rem}
.term:focus-within{border-color:var(--yellow);box-shadow:0 0 18px color-mix(in srgb,var(--yellow) 30%,transparent)}
.prompt{color:var(--yellow);white-space:nowrap}.prompt b{color:var(--cyan);font-weight:400}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;caret-color:var(--yellow)}
.hint{color:var(--dim);font-size:.85rem;margin-top:.7rem;line-height:1.5}.hint span{color:var(--cyan)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.9rem}
.tile{display:block;text-decoration:none;color:var(--text);border:1px solid var(--dim);padding:.85rem 1rem 1rem;
  clip-path:polygon(0 0,100% 0,100% calc(100% - .85rem),calc(100% - .85rem) 100%,0 100%);
  transition:background .15s,color .15s,border-color .15s}
.tile small{color:var(--dim);font-size:.8rem;display:block}
.tile strong{font:700 1.6rem var(--head);letter-spacing:.08em;display:block;margin-top:.35rem}
.tile:hover,.tile:focus-visible{background:var(--yellow);color:#000;border-color:var(--yellow);outline:0}
.tile:hover small,.tile:focus-visible small{color:#000}
.tile.claude strong{color:var(--cyan)}
.tile.claude:hover strong,.tile.claude:focus-visible strong{color:#000}

.row{display:flex;justify-content:space-between;font-size:.85rem;color:var(--dim);margin-top:.6rem}
.row:first-child{margin-top:0}.row b{color:var(--cyan);font-weight:400}
.track{height:.5rem;background:#1b1b1f;margin-top:.25rem}
.track i{display:block;height:100%;width:0;background:var(--yellow)}

.w-code .in{padding:0}
#code{position:absolute;inset:1.1rem 1.3rem 1.3rem;overflow:hidden;font-size:.85rem;line-height:1.55;white-space:pre-wrap;color:var(--text)}
#code .k{color:var(--yellow);font-style:normal}#code .s{color:var(--cyan);font-style:normal}
#code .c{color:var(--dim);font-style:normal}#code .o{color:var(--red);font-style:normal}
.w-net .in{padding:0}
#net{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.netlbl{position:absolute;left:.9rem;bottom:.6rem;font-size:.75rem;color:var(--dim);pointer-events:none}
.w-notes .in{display:flex}
#notes{width:100%;height:100%;resize:none;background:#0a0a0d;color:var(--text);border:1px solid #2a2a2f;font:.9rem/1.5 var(--mono);padding:.6rem;outline:0;caret-color:var(--yellow)}
#notes:focus{border-color:var(--yellow)}

.w-rain .in,.w-log .in{padding:0}
#rain{position:absolute;inset:0;width:100%;height:100%}
#log{position:absolute;inset:.8rem 1.1rem;overflow:hidden;font-size:.78rem;line-height:1.5;color:var(--dim)}
#log b{color:var(--cyan);font-weight:400}#log em{color:var(--red);font-style:normal}
#theme{background:none;border:1px solid #000;color:#000;font:inherit;letter-spacing:inherit;padding:0 .5rem;margin-left:.7rem;cursor:pointer}
#theme:hover{background:#000;color:var(--yellow)}
.eco #clock,.eco .cursor{animation:none}
@media (max-width:900px){
  html{font-size:15px}
  body{height:auto;overflow:auto}
  .desk{height:auto}
  .split{flex-direction:column!important}
  .split>.gutter{display:none}
  .split>*:not(.gutter){flex:none!important}
  .win{min-height:15rem}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){#clock,.cursor{animation:none}}
</style>
</head>
<body>
<main class="desk split v">
  <div class="split h" data-id="top" data-f="1.3">
<section class="win w-main" data-id="main" data-f="2.2">
    <div class="bar"><span>NIGHT_CITY // TERMINAL</span><span><span id="netst">СЕТЬ: ONLINE</span><button id="theme" title="Сменить цвет">ТЕМА</button></span></div>
    <div class="in">
      <div>
        <div id="clock">00:00:00</div>
        <div id="date"></div>
        <div id="greet"></div>
      </div>
      <div>
        <label class="term">
          <span class="prompt">morgan@<b>nightcity</b>:~$</span>
          <input id="q" type="text" autocomplete="off" spellcheck="false" autofocus aria-label="Поиск">
        </label>
        <p class="hint">Enter — поиск в DuckDuckGo. Префиксы: <span>yt</span> <span>gh</span> <span>steam</span> <span>ai</span> + запрос. Клавиши <span>цифры</span> открывают узлы, когда поле пустое. Команды: <span>help</span>.</p>
      </div>
      <nav class="tiles" id="tiles"></nav>
    </div>
  </section>
    <div class="split v" data-id="right" data-f="1">
<section class="win w-prog" data-id="prog" data-f=".45">
    <div class="bar"><span>ПРОГРЕСС</span><span>.sys</span></div>
    <div class="in">
      <div class="row"><span>день</span><b id="p-d"></b></div><div class="track"><i id="b-d"></i></div>
      <div class="row"><span>неделя</span><b id="p-w"></b></div><div class="track"><i id="b-w"></i></div>
      <div class="row"><span>месяц</span><b id="p-m"></b></div><div class="track"><i id="b-m"></i></div>
      <div class="row"><span>год</span><b id="p-y"></b></div><div class="track"><i id="b-y"></i></div>
    </div>
  </section>
<section class="win w-log" data-id="log" data-f=".55">
    <div class="bar"><span>SYSLOG</span><span>live</span></div>
    <div class="in"><div id="log"></div></div>
  </section>
    </div>
  </div>
  <div class="split h" data-id="bot" data-f="1">
<section class="win w-code" data-id="code" data-f="1.1">
    <div class="bar"><span>BREACH.JS</span><span>RUNNING</span></div>
    <div class="in"><div id="code"></div></div>
  </section>
<section class="win w-net" data-id="net" data-f="1">
    <div class="bar"><span>NET // TRACE</span><span>наведи курсор</span></div>
    <div class="in"><canvas id="net"></canvas><div class="netlbl" id="netlbl"></div></div>
  </section>
<section class="win w-rain" data-id="rain" data-f="1">
    <div class="bar"><span>MATRIX</span><span>.raw</span></div>
    <div class="in"><canvas id="rain"></canvas></div>
  </section>
<section class="win w-notes" data-id="notes" data-f=".9">
    <div class="bar"><span>ЗАМЕТКИ</span><span>.txt</span></div>
    <div class="in"><textarea id="notes" spellcheck="false" placeholder="сюда можно писать что угодно..."></textarea></div>
  </section>
  </div>
</main>

<script>
const NAME = "Morgan";
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const LINKS = [ // [название, адрес, подпись] — добавляйте свои строки, до 9 штук
  ["YOUTUBE","https://www.youtube.com","./video"],
  ["GITHUB","https://github.com","./code"],
  ["STEAM","https://store.steampowered.com","./games"],
  ["CLAUDE","https://claude.ai","./netrunner"],
];
$("#tiles").innerHTML = LINKS.slice(0,9).map((l,i) => `<a class="tile${l[0]==="CLAUDE"?" claude":""}" href="${l[1]}" data-k="${i+1}"><small>[${i+1}] ${l[2]}</small><strong>${l[0]}</strong></a>`).join("");

const THEMES = [["#fcee0a","#00f0ff","#ff003c","252,238,10"],["#ff2a6d","#05d9e8","#fcee0a","255,42,109"],["#39ff14","#00f0ff","#ff003c","57,255,20"],["#00f0ff","#fcee0a","#ff003c","0,240,255"]];
let ACC = "252,238,10", ti = 0;
function setTheme(i){
  ti = i % THEMES.length; const t = THEMES[ti], st = document.documentElement.style;
  st.setProperty("--yellow", t[0]); st.setProperty("--cyan", t[1]); st.setProperty("--red", t[2]); ACC = t[3];
  try{ localStorage.setItem("nc-theme", ti); }catch(e){}
}
try{ setTheme(+localStorage.getItem("nc-theme") || 0); }catch(e){}
$("#theme").onclick = () => setTheme(ti+1);

let eco = false, frame = 0, rf = 0;
try{ eco = localStorage.getItem("nc-eco") === "1"; }catch(e){}
function netState(){ $("#netst").textContent = "СЕТЬ: " + (navigator.onLine ? "ONLINE" : "OFFLINE") + (eco ? " · ECO" : ""); }
function setEco(v){ eco = v; document.documentElement.classList.toggle("eco", v); try{ localStorage.setItem("nc-eco", v ? "1" : "0"); }catch(e){} netState(); }
addEventListener("online", () => { netState(); sys("связь восстановлена"); });
addEventListener("offline", () => { netState(); sys("связь потеряна", true); });
setEco(eco);

const days = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
const months = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function tick(){
  const d = new Date(), h = d.getHours();
  $("#clock").textContent = pad(h) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  $("#date").textContent = days[d.getDay()] + ", " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
  const g = h < 6 ? "Доброй ночи" : h < 12 ? "Доброе утро" : h < 18 ? "Добрый день" : "Добрый вечер";
  $("#greet").innerHTML = g + ", " + NAME + ". Подключение установлено<span class='cursor'></span>";
}
tick(); setInterval(tick, 1000);

const engines = {
  yt:    ["https://www.youtube.com/results?search_query=", "https://www.youtube.com"],
  gh:    ["https://github.com/search?q=", "https://github.com"],
  steam: ["https://store.steampowered.com/search/?term=", "https://store.steampowered.com"],
  ai:    ["https://claude.ai/new?q=", "https://claude.ai"],
  ddg:   ["https://duckduckgo.com/?q=", "https://duckduckgo.com"],
};
const DDG = "https://duckduckgo.com/?q=";
const go = url => { location.href = url; };

$("#q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim();
  if (!v) return;
  if (runCmd(v)){ e.target.value = ""; return; }
  const [first, ...rest] = v.split(/\s+/);
  const eng = engines[first.toLowerCase()];
  if (eng) return go(rest.length ? eng[0] + encodeURIComponent(rest.join(" ")) : eng[1]);
  if (/^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v))
    return go(/^https?:/i.test(v) ? v : "https://" + v);
  go(DDG + encodeURIComponent(v));
});
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = document.querySelector('.tile[data-k="' + e.key + '"]');
  if (t) t.click(); else if (e.key.length === 1) $("#q").focus();
});
$("#q").focus();

function bar(id, f){ const v = Math.max(0, Math.min(1, f)); $("#b-"+id).style.width = (v*100)+"%"; $("#p-"+id).textContent = Math.floor(v*100)+"%"; }
function progress(){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  const d0 = new Date(y, m, n.getDate()), dow = (n.getDay()+6)%7, fd = (n - d0)/864e5;
  bar("d", fd); bar("w", (dow + fd)/7);
  bar("m", (n.getDate()-1 + fd)/new Date(y, m+1, 0).getDate());
  bar("y", (n - new Date(y,0,1))/(new Date(y+1,0,1) - new Date(y,0,1)));
}
progress(); setInterval(progress, 1000);


try{ $("#notes").value = localStorage.getItem("nc-notes") || ""; }catch(e){}
$("#notes").addEventListener("input", e => { try{ localStorage.setItem("nc-notes", e.target.value); }catch(err){} });

// ---- печатающийся код ----
const SNIPS = [
`// scan subnet
const nodes = scan("10.77.0.0/16");
for (const n of nodes) {
  if (n.ice) mark(n, "HOSTILE");
}
> найдено узлов: 128`,
`// quickhack: overheat
function overheat(target) {
  const heat = target.cpu * 2;
  inject("overheat.exe", heat);
  return target.status;
}
> цель перегрета`,
`// decrypt data shard
const key = bruteforce(shard, "MAELSTROM");
const data = decrypt(shard, key);
> shard расшифрован: 4.2 МБ`,
`// ping braindance server
const ping = await net.ping("afterlife.club");
if (ping > 100) reroute("relay-7");
> задержка: 23 мс`,
`// wipe traces
function wipe(log) {
  for (const line of log) erase(line);
  return "CLEAN";
}
> следы удалены`,
`// breach protocol v2.77
const target = "arasaka.net";
const ice = scan(target);
if (ice.level > 3) return "ABORT";
inject("quickhack.exe");
> доступ получен`,
`// spoof identity
const id = forge("netrunner");
session.set("alias", id);
> личность подменена`,
`// sandevistan online
function boost(t) {
  for (const f of frames) f.skip(t);
  return "TIME SLOWED";
}
> реакция +400%`,
`// drain eddies
const acc = trace("kiroshi.bank");
if (acc.ice === 0) transfer(acc, "me");
> перевод невозможен`
];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const hl = s => esc(s)
  .replace(/^(>.*)$/gm, "<i class='o'>$1</i>")
  .replace(/(\/\/.*)/g, "<i class='c'>$1</i>")
  .replace(/("[^"]*")/g, "<i class='s'>$1</i>")
  .replace(/\b(const|function|if|return|for|of|await)\b/g, "<i class='k'>$1</i>");
const codeEl = $("#code");
let buf = "", cur = "", pos = 0, last = -1;
function nextSnip(){
  let i; do { i = Math.floor(Math.random()*SNIPS.length); } while (i === last);
  last = i; cur = SNIPS[i] + "\n\n"; pos = 0;
}
function typeCode(){
  if (pos >= cur.length) nextSnip();
  const ch = cur[pos++]; buf += ch;
  if (ch === "\n"){ const l = buf.split("\n"); if (l.length > 40) buf = l.slice(-40).join("\n"); }
  codeEl.innerHTML = hl(buf) + "<span class='cursor'></span>";
  codeEl.scrollTop = codeEl.scrollHeight;
  setTimeout(typeCode, ch === "\n" ? 220 : 30 + Math.random()*40);
}
if (reduce) codeEl.innerHTML = hl(SNIPS[0]); else typeCode();

// ---- интерактивная сеть ----
const cv = $("#net"), cx = cv.getContext("2d");
let W = 0, H = 0, nodes = [];
const mouse = {x:-999, y:-999};
function fit(){
  const r = cv.parentElement.getBoundingClientRect(), nw = Math.max(1, r.width), nh = Math.max(1, r.height);
  nodes.forEach(n => { n.x *= nw/(W||nw); n.y *= nh/(H||nh); });
  W = cv.width = nw; H = cv.height = nh;
  const want = Math.round(W*H/8000);
  nodes.length = Math.min(nodes.length, want);
  while (nodes.length < want) nodes.push({x: Math.random()*W, y: Math.random()*H, vx: reduce ? 0 : (Math.random()-.5)*.6, vy: reduce ? 0 : (Math.random()-.5)*.6});
}
new ResizeObserver(fit).observe(cv.parentElement);
cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
cv.addEventListener("mouseleave", () => { mouse.x = mouse.y = -999; });
function draw(){
  if (eco && (frame++ % 4)){ requestAnimationFrame(draw); return; }
  cx.clearRect(0, 0, W, H);
  let links = 0;
  for (const n of nodes){
    n.x += n.vx; n.y += n.vy;
    const dx = n.x - mouse.x, dy = n.y - mouse.y, d = Math.hypot(dx, dy);
    if (d < 90 && d > 0){ n.x += dx/d*1.6; n.y += dy/d*1.6; }
    if (n.x < 0){ n.x = 0; n.vx = Math.abs(n.vx); } else if (n.x > W){ n.x = W; n.vx = -Math.abs(n.vx); }
    if (n.y < 0){ n.y = 0; n.vy = Math.abs(n.vy); } else if (n.y > H){ n.y = H; n.vy = -Math.abs(n.vy); }
  }
  for (let i = 0; i < nodes.length; i++){
    const a = nodes[i];
    for (let j = i+1; j < nodes.length; j++){
      const b = nodes[j], d = Math.hypot(a.x-b.x, a.y-b.y);
      if (d < 100){ cx.strokeStyle = "rgba(" + ACC + "," + (1-d/100)*.55 + ")"; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); links++; }
    }
    const dm = Math.hypot(a.x-mouse.x, a.y-mouse.y);
    if (dm < 150){ cx.strokeStyle = "rgba(0,240,255," + (1-dm/150) + ")"; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(mouse.x,mouse.y); cx.stroke(); }
    cx.fillStyle = "rgb(" + ACC + ")"; cx.fillRect(a.x-1.5, a.y-1.5, 3, 3);
  }
  $("#netlbl").textContent = "узлов: " + nodes.length + "  связей: " + links;
  if (!reduce) requestAnimationFrame(draw);
}
fit(); draw();

// ---- матричный дождь ----
const rc = $("#rain"), rx = rc.getContext("2d"), FS = 14;
const GL = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄ0123456789ABCDEF";
let RW = 0, RH = 0, cols = [];
function rfit(){
  const r = rc.parentElement.getBoundingClientRect();
  RW = rc.width = Math.max(1, r.width); RH = rc.height = Math.max(1, r.height);
  cols = Array.from({length: Math.ceil(RW/FS)}, (_, i) => cols[i] ?? Math.random()*RH/FS);
  rx.fillStyle = "#101014"; rx.fillRect(0, 0, RW, RH);
}
new ResizeObserver(rfit).observe(rc.parentElement);
function rainTick(){
  if (document.hidden || (eco && (rf++ % 3))) return;
  rx.fillStyle = "rgba(16,16,20,.12)"; rx.fillRect(0, 0, RW, RH); rx.font = FS + "px monospace";
  cols.forEach((y, i) => {
    rx.fillStyle = Math.random() < .03 ? "#fff" : "rgb(" + ACC + ")";
    rx.fillText(GL[Math.floor(Math.random()*GL.length)], i*FS, y*FS);
    cols[i] = (y*FS > RH && Math.random() > .975) ? 0 : y + 1;
  });
}
rfit(); if (!reduce) setInterval(rainTick, 70);

// ---- системный лог и команды ----
function sys(msg, bad){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  lg.insertAdjacentHTML("beforeend", "<div><b>[" + t + "]</b> " + (bad ? "<em>" : "") + esc(msg) + (bad ? "</em>" : "") + "</div>");
  while (lg.children.length > 40) lg.firstChild.remove();
  lg.scrollTop = lg.scrollHeight;
}
function runCmd(v){
  const w = v.toLowerCase().split(/\s+/), c = w[0], a = w[1], n = w.length;
  if (c === "help" && n === 1){ sys("команды: help · theme [1-4] · eco [on/off] · reset · clear"); sys("поиск: yt gh steam ai ddg + запрос"); return true; }
  if (c === "theme" && n <= 2){ const k = +a; setTheme(k >= 1 && k <= 4 ? k - 1 : ti + 1); sys("тема " + (ti + 1) + " из " + THEMES.length); return true; }
  if (c === "eco" && n <= 2){ setEco(a === "on" ? true : a === "off" ? false : !eco); sys("эко-режим: " + (eco ? "ВКЛ" : "ВЫКЛ")); return true; }
  if (c === "reset" && n === 1){ document.querySelectorAll("[data-id]").forEach(e => setG(e, e.dataset.f)); saveG(); sys("раскладка сброшена"); return true; }
  if (c === "clear" && n === 1){ lg.innerHTML = ""; return true; }
  return false;
}
const LOGM = ["ICE обнаружен на узле","сканирование порта","пакет перехвачен","туннель установлен","прокси сменён","ключ принят","сигнал потерян","дрон замечен в секторе","шифрование обновлено"];
const lg = $("#log");
function logLine(){
  const d = new Date(), t = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  const hex = Math.floor(Math.random()*65535).toString(16).toUpperCase().padStart(4, "0");
  const m = LOGM[Math.floor(Math.random()*LOGM.length)];
  lg.insertAdjacentHTML("beforeend", "<div><b>[" + t + "]</b> " + (Math.random() < .18 ? "<em>ВНИМАНИЕ</em> " : "") + m + " 0x" + hex + "</div>");
  while (lg.children.length > 40) lg.firstChild.remove();
  lg.scrollTop = lg.scrollHeight;
}
for (let i = 0; i < 6; i++) logLine();
if (!reduce) setInterval(logLine, 1300);

// ---- тайлинг: границы между окнами тянутся мышкой, двойной клик — сброс ----
const gv = el => parseFloat(el.dataset.g ?? el.dataset.f);
const setG = (el, v) => { el.dataset.g = v; el.style.flex = v + " 1 0px"; };
let saved = {}; try{ saved = JSON.parse(localStorage.getItem("nc-layout")) || {}; }catch(e){}
const saveG = () => { const o = {}; document.querySelectorAll("[data-id]").forEach(e => o[e.dataset.id] = gv(e)); try{ localStorage.setItem("nc-layout", JSON.stringify(o)); }catch(e){} };
document.querySelectorAll("[data-id]").forEach(e => setG(e, saved[e.dataset.id] ?? e.dataset.f));
document.querySelectorAll(".split").forEach(sp => {
  const horiz = sp.classList.contains("h"), kids = [...sp.children];
  kids.slice(0, -1).forEach((a, i) => {
    const b = kids[i+1], g = document.createElement("div");
    g.className = "gutter"; g.title = "Тяните, чтобы изменить размер. Двойной клик — сброс.";
    sp.insertBefore(g, b);
    g.addEventListener("dblclick", () => { setG(a, a.dataset.f); setG(b, b.dataset.f); saveG(); });
    g.addEventListener("pointerdown", e => {
      e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add("on");
      const pr = horiz ? "offsetWidth" : "offsetHeight", pt = horiz ? "clientX" : "clientY";
      const sa = a[pr], tot = sa + b[pr], gt = gv(a) + gv(b), st = e[pt];
      const mv = ev => { const na = Math.max(90, Math.min(tot - 90, sa + ev[pt] - st)); setG(a, gt*na/tot); setG(b, gt*(tot-na)/tot); };
      const up = () => { g.classList.remove("on"); g.removeEventListener("pointermove", mv); g.removeEventListener("pointerup", up); saveG(); };
      g.addEventListener("pointermove", mv); g.addEventListener("pointerup", up);
    });
  });
});
try{ if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {}); }catch(e){}
</script>
